# Elemente 1 bis 20. Quelle: de.wikipedia.org, Infobox der Artikel der Elemente (Ordnungszahl, Gruppe, Atommasse,
# Elektronenkonfiguration; am 2026-10-18 geöffnet). massenzahl: die auf eine ganze Zahl gerundete Atommasse, das ist
# die Massenzahl des häufigsten Isotops (H 1, He 4, Li 7, Be 9, B 11, …). neutronen = massenzahl − ordnungszahl.
# schalen: Elektronen auf den Schalen K, L, M, N aus der Elektronenkonfiguration. art: metall, nichtmetall, halbmetall
# (Wikipedia Halbmetalle: u. a. Bor, Silicium).
