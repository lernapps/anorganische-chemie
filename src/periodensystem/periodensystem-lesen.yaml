  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Kohlenstoff im Periodensystem
          en: Carbon in the periodic table
        blocks:
          - type: text
            text:
              de: |
                Das Symbol ist C, die Ordnungszahl 6. Kohlenstoff steht in Periode 2, denn seine Atome haben zwei Schalen. Es steht in Gruppe 14.
              en: |
                The symbol is C, the atomic number 6. Carbon is in period 2, because its atoms have two shells. It is in group 14.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: generated
        id: ordnungszahl-ablesen
        practice:
          de: "Übe selbst, mit immer neuen Elementen:"
          en: "Practise on your own, with new elements every time:"
        given:
          e:
            pick: 1
            from:
              data: elemente
        task:
          text:
            de: Welche Ordnungszahl hat {{e.name}} (Symbol {{e.symbol}})?
            en: What is the atomic number of {{e.name}} (symbol {{e.symbol}})?
        answer:
          value: e.ordnungszahl
          compare: number
        hint:
          de: Suche das Symbol {{e.symbol}} in der Tabelle. Die Zahl in der Klammer ist die Ordnungszahl.
          en: Look for the symbol {{e.symbol}} in the table. The number in brackets is the atomic number.
        steps:
          - de: "{{e.name}} hat die Ordnungszahl {{answer}}."
            en: "{{e.name}} has the atomic number {{answer}}."
      - type: generated
        id: periode-bestimmen
        practice:
          de: "Übe selbst, mit immer neuen Elementen:"
          en: "Practise on your own, with new elements every time:"
        given:
          e:
            pick: 1
            from:
              data: elemente
        task:
          text:
            de: In welcher Periode steht {{e.name}} (Symbol {{e.symbol}})?
            en: In which period is {{e.name}} (symbol {{e.symbol}})?
        answer:
          value: e.periode
          compare: number
        hint:
          de: Die Periode ist die Zeile in der Tabelle, in der das Symbol {{e.symbol}} steht. Sie ist auch die Zahl der Elektronenschalen.
          en: The period is the row of the table in which the symbol {{e.symbol}} stands. It is also the number of electron shells.
        steps:
          - de: "{{e.name}} steht in Periode {{answer}}."
            en: "{{e.name}} is in period {{answer}}."
