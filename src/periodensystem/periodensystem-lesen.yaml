# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Periodensystem lesen
  en: Reading the periodic table
description:
  de: Das Periodensystem ordnet alle Elemente. So liest du Ordnungszahl, Symbol, Periode und Gruppe ab.
  en: The periodic table orders all elements. This is how you read the atomic number, symbol, period and group.
blocks:
  - type: section
    id: warum
    title:
      de: Warum
      en: Why
    blocks:
      - type: text
        text:
          de: |
            Es gibt über hundert Elemente. Das Periodensystem ordnet sie so, dass Elemente mit ähnlichen Eigenschaften untereinander stehen. Wer es lesen kann, findet zu jedem Element schnell die wichtigsten Angaben.
          en: |
            There are over a hundred elements. The periodic table orders them so that elements with similar properties stand below each other. If you can read it, you quickly find the most important facts about any element.
  - type: section
    id: regel
    title:
      de: Regel
      en: Rule
    blocks:
      - type: definition
        term:
          de: Elementsymbol
          en: Element symbol
        explanation:
          de: Das Elementsymbol ist die Abkürzung für ein Element aus einem oder zwei Buchstaben, zum Beispiel C für Kohlenstoff.
          en: The element symbol is the abbreviation of an element with one or two letters, for example C for carbon.
      - type: definition
        term:
          de: Periode
          en: Period
        explanation:
          de: Eine Periode ist eine Zeile im Periodensystem. Die Nummer der Periode sagt, wie viele Schalen ein Atom hat.
          en: A period is a row in the periodic table. The number of the period tells how many shells an atom has.
      - type: definition
        term:
          de: Gruppe
          en: Group
        explanation:
          de: Eine Gruppe ist eine Spalte im Periodensystem. Elemente einer Gruppe haben ähnliche Eigenschaften.
          en: A group is a column in the periodic table. Elements in one group have similar properties.
      - type: text
        text:
          de: |
            Die Elemente sind nach steigender Ordnungszahl geordnet, in jeder Zeile von links nach rechts. Nach jedem Edelgas beginnt eine neue Zeile.
          en: |
            The elements are ordered by increasing atomic number, in every row from left to right. After every noble gas a new row begins.
      - type: table
        caption:
          de: "Die Elemente der acht Hauptgruppen (ohne die superschweren): Spalten sind die Hauptgruppen, Zeilen die Perioden. In Klammern steht die Ordnungszahl. Die Übergangsmetalle in der Mitte des Periodensystems fehlen hier."
          en: "The elements of the eight main groups (without the superheavy ones): the columns are the main groups, the rows are the periods. The atomic number is in brackets. The transition metals in the middle of the periodic table are missing here."
        header:
          - de: Periode
            en: Period
