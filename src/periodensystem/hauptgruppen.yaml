                - de: Kühlmittel für die Magnete in MRT-Geräten
                  en: Coolant for the magnets in MRI scanners
                - de: Teil von Atemgas-Gemischen beim professionellen Tauchen
                  en: Part of breathing gas mixtures for professional diving
              fact:
                de: Helium wurde zuerst auf der Sonne entdeckt, daher der Name (griechisch helios = Sonne).
                en: Helium was first spotted on the Sun, hence its name (Greek helios = sun).
              note:
                de: Helium ist ein Edelgas und bildet keine bekannten beständigen Verbindungen, deshalb sind hier keine aufgeführt.
                en: Helium is a noble gas and forms no known stable compounds, so none are listed.
            - symbol:
