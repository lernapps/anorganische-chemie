                en: Of all elements lighter than iron, beryllium is the rarest.
              note:
                de: Beryllium und seine Verbindungen sind giftig und werden nur in wenigen Anwendungen genutzt.
                en: Beryllium and its compounds are toxic and are used in only a few applications.
