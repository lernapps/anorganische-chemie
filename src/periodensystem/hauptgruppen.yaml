      - type: single-choice
        id: hauptgruppe-brom
        text:
          de: Brom steht in Gruppe 17 des Periodensystems. In welcher Hauptgruppe steht es?
          en: Bromine is in group 17 of the periodic table. In which main group is it?
        options:
          - text:
              de: Hauptgruppe VII
              en: Main group VII
            correct: true
            info:
              de: Gruppe 17 ist die Hauptgruppe VII (17 − 10 = 7). Brom hat 7 Außenelektronen und gehört zu den Halogenen.
              en: Group 17 is main group VII (17 − 10 = 7). Bromine has 7 outer electrons and is a halogen.
          - text:
              de: Hauptgruppe VIII
              en: Main group VIII
            correct: false
            info:
              de: Die Hauptgruppe VIII ist Gruppe 18, die Edelgase. Brom steht links daneben.
              en: Main group VIII is group 18, the noble gases. Bromine is next to it on the left.
          - text:
              de: Hauptgruppe VI
              en: Main group VI
            correct: false
            info:
              de: Die Hauptgruppe VI ist Gruppe 16, die Chalkogene mit Sauerstoff und Schwefel.
              en: Main group VI is group 16, the chalcogens with oxygen and sulfur.
        explanation:
          de: Bei den Gruppen 13 bis 18 ziehst du 10 ab, um die Hauptgruppe zu bekommen.
          en: For groups 13 to 18 you subtract 10 to get the main group.
