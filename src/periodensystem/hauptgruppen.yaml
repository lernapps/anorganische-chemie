# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Die acht Hauptgruppen
  en: The eight main groups
description:
  de: Alle acht Hauptgruppen mit allen ihren Elementen. Die Hauptgruppe sagt, wie viele Elektronen außen sitzen.
  en: All eight main groups with all their elements. The main group tells how many electrons are in the outer shell.
blocks:
  - type: section
    id: warum
    title:
      de: Warum
      en: Why
    blocks:
      - type: text
        text:
          de: |
            Elemente in einer Gruppe verhalten sich ähnlich. Wer die Hauptgruppe kennt, kann vorhersagen, wie ein Element sich verhält.
          en: |
            Elements in one group behave in a similar way. If you know the main group, you can predict how an element behaves.
  - type: section
    id: entdecken
    title:
      de: Entdecke die Elemente
      en: Explore the elements
    blocks:
      - type: text
        text:
          de: |
            Jede Farbe ist eine Hauptgruppe. Tippe auf ein Element und erfahre, wie seine Atome gebaut sind, welche Verbindungen es bildet und wozu man es nutzt.
          en: |
            Every colour is a main group. Tap an element to find out how its atoms are built, which compounds it forms and what it is used for.
      - type: vue-component
        component: PeriodicTable
        props:
          labels:
            legend:
              de: Hauptgruppen
              en: Main groups
            table:
              de: Periodensystem der Hauptgruppen-Elemente. Wähle ein Element.
              en: Periodic table of the main-group elements. Choose an element.
            period:
              de: Periode
              en: Period
            groupWord:
              de: Hauptgruppe
              en: Main group
            number:
              de: Ordnungszahl
              en: Atomic number
            shells:
              de: Elektronen pro Schale
              en: Electrons per shell
            compounds:
              de: Übliche Verbindungen
              en: Common compounds
            uses:
              de: Wozu man es nutzt
              en: What it is used for
            fact:
              de: Wusstest du?
              en: Did you know?
            choose:
              de: Tippe auf ein Element, um mehr zu erfahren. Tippe auf eine Gruppe oben, um sie hervorzuheben.
              en: Tap an element to learn more. Tap a group above to highlight it.
          groups:
            - group: 1
              roman:
                de: I
                en: I
              name:
                de: Alkalimetalle (und Wasserstoff)
                en: Alkali metals (and hydrogen)
              text:
                de: Silbrig glänzende, reaktive Metalle mit einem Außenelektron, das sie leicht abgeben. Wasserstoff steht auch in dieser Gruppe, ist aber kein Alkalimetall.
                en: Shiny silvery, reactive metals with one outer electron that they give away easily. Hydrogen is in this group too, but it is not an alkali metal.
            - group: 2
              roman:
                de: II
                en: II
              name:
                de: Erdalkalimetalle
                en: Alkaline earth metals
              text:
                de: Glänzende, reaktive Metalle mit zwei Außenelektronen. Radium ist radioaktiv.
                en: Shiny, reactive metals with two outer electrons. Radium is radioactive.
            - group: 13
              roman:
                de: III
                en: III
              name:
                de: Borgruppe
                en: Boron group
              text:
                de: Bor ist ein Halbmetall, die übrigen Elemente (Aluminium, Gallium, Indium, Thallium) sind Metalle.
                en: Boron is a metalloid, the other elements (aluminium, gallium, indium, thallium) are metals.
            - group: 14
              roman:
                de: IV
                en: IV
              name:
                de: Kohlenstoff-Silicium-Gruppe
                en: Carbon–silicon group
              text:
                de: Sie reicht von Kohlenstoff, einem Nichtmetall, bis zu Blei, einem Metall. Die Gruppe heißt nach ihren ersten beiden Elementen.
                en: It reaches from carbon, a non-metal, to lead, a metal. The group is named after its first two elements.
            - group: 15
              roman:
                de: V
                en: V
              name:
                de: Stickstoff-Phosphor-Gruppe
                en: Nitrogen–phosphorus group
              text:
                de: Stickstoff und Phosphor sind Nichtmetalle, Arsen und Antimon Halbmetalle, Bismut ist ein Metall.
                en: Nitrogen and phosphorus are non-metals, arsenic and antimony are metalloids, bismuth is a metal.
            - group: 16
              roman:
                de: VI
                en: VI
              name:
                de: Chalkogene
                en: Chalcogens
              text:
                de: Der Name heißt „Erzbildner“. Die Gruppe wird nach ihrem ersten Element auch Sauerstoffgruppe genannt.
                en: The name means “ore formers”. After its first element the group is also called the oxygen group.
            - group: 17
              roman:
                de: VII
                en: VII
              name:
                de: Halogene
                en: Halogens
              text:
                de: Der Name heißt „Salzbildner“. Die Elemente sind farbige, sehr reaktionsfreudige Nichtmetalle und bilden mit Metallen Salze.
                en: The name means “salt formers”. The elements are coloured, very reactive non-metals and form salts with metals.
            - group: 18
              roman:
                de: VIII
                en: VIII
              name:
                de: Edelgase
                en: Noble gases
              text:
                de: Sie reagieren nur unter extremen Bedingungen, sind einatomig und bei Raumtemperatur Gase. Helium ist das häufigste Edelgas, auf der Erde ist es Argon.
                en: They react only under extreme conditions, consist of single atoms and are gases at room temperature. Helium is the most common noble gas, on Earth it is argon.
          elements:
            - symbol:
                de: H
                en: H
              name:
                de: Wasserstoff
                en: Hydrogen
              number: 1
              group: 1
              period: 1
              kind:
                de: Nichtmetall
                en: non-metal
              kindId:
                de: nichtmetall
                en: nichtmetall
              shells:
                de: "1"
                en: "1"
              compounds:
                - formula:
                    de: H2O
                    en: H2O
                  text:
                    de: "Wasser: bedeckt den größten Teil unseres Planeten"
                    en: "Water: covers most of our planet's surface"
                - formula:
                    de: CH4
                    en: CH4
                  text:
                    de: "Methan: wichtiger Bestandteil von Erdgas"
                    en: "Methane: an important part of natural gas"
                - formula:
                    de: NH3
                    en: NH3
                  text:
                    de: "Ammoniak: Ausgangsstoff für Dünger, aus Wasserstoff und Stickstoff hergestellt"
                    en: "Ammonia: made from hydrogen and nitrogen, a starting material for fertiliser"
              uses:
                - de: Treibstoff für Raketen und zum Schweißen
                  en: Rocket fuel, and used in welding
                - de: Härten von Pflanzenöl, so entsteht Margarine
                  en: Hardens plant oil, which is how margarine is made
                - de: Füllgas für Wetterballons, weil es sehr leicht ist
                  en: Lifting gas for weather balloons because it is so light
              fact:
                de: Kein Element kommt im Weltall öfter vor als Wasserstoff.
                en: Hydrogen is the most common element in the whole universe.
            - symbol:
                de: He
                en: He
              name:
                de: Helium
                en: Helium
              number: 2
              group: 18
              period: 1
              kind:
                de: Nichtmetall
