title:
  de: Anorganische Chemie – Einstieg
  en: Inorganic chemistry – first steps
intro:
  de: |
    Woraus bestehen Stoffe? Du lernst Reinstoffe und Gemische kennen, baust Atome, liest das Periodensystem und stellst einfache Reaktionsgleichungen auf. Auf jeder Seite übst du selbst.
    Für die unteren Klassenstufen (Klasse 7 und 8).
  en: |
    What are substances made of? You learn about pure substances and mixtures, build atoms, read the periodic table and write simple reaction equations. You practise on every page.
    For the lower grades (grades 7 and 8).
languages:
  - de
  - en
chapters:
  - stoffe
  - teilchen
