title: Anorganische Chemie – Einstieg
intro: |
  Woraus bestehen Stoffe? Du lernst Reinstoffe und Gemische kennen, baust Atome, liest das Periodensystem und
  stellst einfache Reaktionsgleichungen auf. Auf jeder Seite übst du selbst.
  Für die unteren Klassenstufen (Klasse 7 und 8).
languages: [de]
chapters: [stoffe]
